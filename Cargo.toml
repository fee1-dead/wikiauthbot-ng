[workspace]
members = [
    "wikiauthbot-server",
    "wikiauthbot-db",
    "wikiauthbot-common", "keygen",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.80.0"
edition = "2021"

[workspace.dependencies]
arc-swap = "1.7.1"
chrono = "0.4.31"
color-eyre = "0.6.2"
dotenvy = "0.15.7"
fluent = "0.16.0"
fred = "10.1.0"
futures = "0.3.30"
mwapi = "0.6.0"
reqwest = { version = "0.11.27", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
tracing = "0.1.40"
tokio = { version = "1.35.0", features = ["rt-multi-thread", "signal"] }
# pinned due to issue https://github.com/launchbadge/sqlx/issues/3241
sqlx = { version = "=0.7.3", features = ["runtime-tokio", "mysql"] }
sha3 = "0.10.8"
rand = "0.9.1"
percent-encoding = "2.3.2"

wikiauthbot-common = { path = "./wikiauthbot-common" }
wikiauthbot-db = { path = "./wikiauthbot-db" }

[package]
name = "wikiauthbot-ng"
version.workspace = true
rust-version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono.workspace = true
color-eyre.workspace = true
dotenvy.workspace = true
mwapi.workspace = true
poise = "0.6.1-rc"
fred.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
wikiauthbot-common.workspace = true
wikiauthbot-db.workspace = true

[dependencies.serenity]
version = "0.12.0"
default-features = false
features = ["client", "model", "cache", "rustls_backend"]

[profile.release]
debug = true
